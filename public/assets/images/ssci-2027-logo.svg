<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" role="img" aria-labelledby="title desc">
  <title id="title">IEEE SSCI 2027 logo</title>
  <desc id="desc">Line drawing of the Gold Coast skyline, sunset, beach, and waves beside the IEEE SSCI 2027 name.</desc>
  <defs>
    <linearGradient id="sunset" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f7a51b"/>
      <stop offset="0.55" stop-color="#f26722"/>
      <stop offset="1" stop-color="#00629b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00a5b5"/>
      <stop offset="1" stop-color="#00629b"/>
    </linearGradient>
  </defs>

  <rect width="280" height="72" rx="8" fill="#fff"/>
  <g transform="translate(4 5)">
