    <text x="82" y="30" font-size="20" font-weight="800" letter-spacing="0">IEEE SSCI</text>
    <text x="203" y="30" font-size="20" font-weight="800" fill="#f26722" letter-spacing="0">2027</text>
    <text x="82" y="50" font-size="12" font-weight="700" letter-spacing="0.6" fill="#00629b">GOLD COAST, AUSTRALIA</text>
